<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calculator</title>
    <!-- desktop-sdk -->
    <!-- desktop-ui -->
    <style>
      body { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
      .display { padding: 8px 4px; text-align: right; }
      .expression { min-height: 20px; }
      .value { overflow-wrap: anywhere; }
      .keys { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .keys .ui-button { min-height: 0; padding: 0; font-size: 18px; }
      .wide { grid-column: span 2; }
    </style>
  </head>
  <body>
    <div class="display" aria-live="polite">
      <div class="expression ui-small ui-muted" id="expression"></div>
      <div class="value ui-display" id="value">0</div>
    </div>
    <div class="keys">
      <button type="button" data-action="clear" class="ui-button ui-button--secondary">C</button>
      <button type="button" data-action="sign" class="ui-button ui-button--secondary">±</button>
      <button type="button" data-action="percent" class="ui-button ui-button--secondary">%</button>
      <button type="button" data-op="/" class="ui-button ui-button--secondary" aria-label="Divide">÷</button>
      <button type="button" data-digit="7" class="ui-button">7</button>
      <button type="button" data-digit="8" class="ui-button">8</button>
      <button type="button" data-digit="9" class="ui-button">9</button>
      <button type="button" data-op="*" class="ui-button ui-button--secondary" aria-label="Multiply">×</button>
      <button type="button" data-digit="4" class="ui-button">4</button>
      <button type="button" data-digit="5" class="ui-button">5</button>
      <button type="button" data-digit="6" class="ui-button">6</button>
      <button type="button" data-op="-" class="ui-button ui-button--secondary" aria-label="Subtract">−</button>
      <button type="button" data-digit="1" class="ui-button">1</button>
      <button type="button" data-digit="2" class="ui-button">2</button>
      <button type="button" data-digit="3" class="ui-button">3</button>
      <button type="button" data-op="+" class="ui-button ui-button--secondary" aria-label="Add">+</button>
      <button type="button" data-digit="0" class="ui-button wide">0</button>
      <button type="button" data-action="dot" class="ui-button">.</button>
      <button type="button" data-action="equals" class="ui-button ui-button--primary" aria-label="Equals">=</button>
    </div>

    <script>
      (function () {
        "use strict";

        var SYMBOLS = { "+": "+", "-": "−", "*": "×", "/": "÷" };
        var valueEl = document.getElementById("value");
        var expressionEl = document.getElementById("expression");
        var current = "0";
        var stored = null;
        var operator = null;
        var fresh = true;

        function format(number) {
          if (!isFinite(number)) return "Error";
          var rounded = Math.round(number * 1e10) / 1e10;
          return String(rounded);
        }

        function compute(a, b, op) {
          switch (op) {
            case "+": return a + b;
            case "-": return a - b;
            case "*": return a * b;
            case "/": return b === 0 ? NaN : a / b;
          }
          return b;
        }

        function render() {
          valueEl.textContent = current;
          expressionEl.textContent = operator ? format(stored) + " " + SYMBOLS[operator] : "";
        }

        function inputDigit(digit) {
          if (current === "Error" || fresh) {
            current = digit;
            fresh = false;
          } else if (current.replace("-", "").length < 15) {
            current = current === "0" ? digit : current + digit;
          }
        }

        function inputDot() {
          if (current === "Error" || fresh) {
            current = "0.";
            fresh = false;
          } else if (current.indexOf(".") === -1) {
            current += ".";
          }
        }

        function chooseOperator(op) {
          if (current === "Error") return;
          if (operator && !fresh) {
            current = format(compute(stored, parseFloat(current), operator));
          }
          stored = parseFloat(current);
          operator = op;
          fresh = true;
        }

        function equals() {
          if (!operator || current === "Error") return;
          current = format(compute(stored, parseFloat(current), operator));
          stored = null;
          operator = null;
          fresh = true;
        }

        function handle(key) {
          if (/^\d$/.test(key)) inputDigit(key);
          else if (key === ".") inputDot();
          else if (SYMBOLS[key]) chooseOperator(key);
          else if (key === "=" || key === "Enter") equals();
          else if (key === "Escape" || key === "c" || key === "C") {
            current = "0"; stored = null; operator = null; fresh = true;
          } else if (key === "Backspace") {
            if (!fresh && current !== "Error") current = current.length > 1 ? current.slice(0, -1) : "0";
          } else if (key === "sign") {
            if (current !== "0" && current !== "Error") current = current[0] === "-" ? current.slice(1) : "-" + current;
          } else if (key === "%") {
            if (current !== "Error") current = format(parseFloat(current) / 100);
          } else {
            return false;
          }
          render();
          return true;
        }

        document.querySelector(".keys").addEventListener("click", function (event) {
          var button = event.target.closest("button");
          if (!button) return;
          var data = button.dataset;
          if (data.digit) handle(data.digit);
          else if (data.op) handle(data.op);
          else if (data.action === "dot") handle(".");
          else if (data.action === "equals") handle("=");
          else if (data.action === "clear") handle("Escape");
          else if (data.action === "sign") handle("sign");
          else if (data.action === "percent") handle("%");
        });

        document.addEventListener("keydown", function (event) {
          if (event.ctrlKey || event.metaKey || event.altKey) return;
          if (handle(event.key)) event.preventDefault();
        });

        render();
      })();
    </script>
  </body>
</html>
