<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Focus Timer</title>
    <!-- desktop-sdk -->
    <!-- desktop-ui -->
    <style>
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      /* Focus uses the theme's main colour, breaks use its second chart colour. */
      body { --session: var(--primary); }
      body.break { --session: var(--chart-2); }
      .ring { position: relative; width: 180px; height: 180px; }
      .ring svg { transform: rotate(-90deg); }
      .ring .track { stroke: var(--muted); }
      .ring .bar { stroke: var(--session); transition: stroke 0.2s; }
      .time { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; }
      .mode { color: var(--session); }
    </style>
  </head>
  <body>
    <div class="mode ui-overline" id="mode">Focus</div>
    <div class="ring">
      <svg width="180" height="180" viewBox="0 0 180 180" aria-hidden="true">
        <circle cx="90" cy="90" r="80" fill="none" class="track" stroke-width="10" />
        <circle id="progress" cx="90" cy="90" r="80" fill="none" class="bar" stroke-width="10" stroke-linecap="round" />
      </svg>
      <div class="time ui-display" id="time" role="timer" aria-live="off">25:00</div>
    </div>
    <div class="ui-row ui-gap-sm">
      <button type="button" id="start" class="ui-button ui-button--primary ui-button--pill">Start</button>
      <button type="button" id="reset" class="ui-button ui-button--pill">Reset</button>
      <button type="button" id="skip" class="ui-button ui-button--pill">Skip</button>
    </div>
    <div class="ui-small ui-muted" id="sessions" aria-live="polite">0 focus sessions completed</div>

    <script>
      (function () {
        "use strict";

        var DURATIONS = { focus: 25 * 60, break: 5 * 60 };
        var CIRCUMFERENCE = 2 * Math.PI * 80;
        var mode = "focus";
        var remaining = DURATIONS.focus;
        var completed = 0;
        var timer = null;
        var endsAt = 0;

        var timeEl = document.getElementById("time");
        var modeEl = document.getElementById("mode");
        var sessionsEl = document.getElementById("sessions");
        var startButton = document.getElementById("start");
        var progress = document.getElementById("progress");
        progress.setAttribute("stroke-dasharray", String(CIRCUMFERENCE));

        function pad(value) {
          return value < 10 ? "0" + value : String(value);
        }

        function render() {
          var minutes = Math.floor(remaining / 60);
          var seconds = remaining % 60;
          var label = pad(minutes) + ":" + pad(seconds);
          timeEl.textContent = label;
          modeEl.textContent = mode === "focus" ? "Focus" : "Break";
          document.body.classList.toggle("break", mode === "break");
          progress.setAttribute("stroke-dashoffset", String(CIRCUMFERENCE * (1 - remaining / DURATIONS[mode])));
          sessionsEl.textContent = completed + (completed === 1 ? " focus session" : " focus sessions") + " completed";
          startButton.textContent = timer ? "Pause" : "Start";
          desktop.setTitle((timer ? label + " · " : "") + "Focus Timer");
        }

        function stop() {
          clearInterval(timer);
          timer = null;
        }

        function switchMode() {
          if (mode === "focus") {
            completed += 1;
            desktop.saveState({ completed: completed });
          }
          mode = mode === "focus" ? "break" : "focus";
          remaining = DURATIONS[mode];
        }

        function tick() {
          remaining = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
          if (remaining === 0) {
            stop();
            switchMode();
          }
          render();
        }

        startButton.addEventListener("click", function () {
          if (timer) {
            stop();
          } else {
            endsAt = Date.now() + remaining * 1000;
            timer = setInterval(tick, 250);
          }
          render();
        });

        document.getElementById("reset").addEventListener("click", function () {
          stop();
          remaining = DURATIONS[mode];
          render();
        });

        document.getElementById("skip").addEventListener("click", function () {
          stop();
          mode = mode === "focus" ? "break" : "focus";
          remaining = DURATIONS[mode];
          render();
        });

        desktop.onInit(function (init) {
          if (init.state && typeof init.state.completed === "number") {
            completed = init.state.completed;
          }
          render();
        });

        render();
      })();
    </script>
  </body>
</html>
