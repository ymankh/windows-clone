<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Palette Lab</title>
    <!-- desktop-sdk -->
    <!-- desktop-ui -->
    <style>
      .base { width: 44px; min-height: 34px; padding: 2px; border: 1px solid var(--input); border-radius: var(--radius); background: var(--background); cursor: pointer; }
      .harmony { width: auto; }
      .swatches { display: grid; grid-template-columns: repeat(5, 1fr); height: 150px; overflow: hidden; border-radius: var(--ui-radius-lg); border: 1px solid var(--border); }
      .swatch { display: flex; align-items: flex-end; justify-content: center; padding: 8px 4px; font: 600 12px var(--font-mono); }
      .mini { display: flex; flex: 1; height: 22px; overflow: hidden; border-radius: var(--ui-radius-sm); }
      .mini span { flex: 1; }
      .preview { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .preview .chip { padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: 12px; }
    </style>
  </head>
  <body class="ui-app">
    <header class="ui-toolbar">
      <input type="color" class="base" id="base" aria-label="Starting colour" />
      <select class="ui-select harmony" id="harmony" aria-label="Colour harmony">
        <option value="analogous">Neighbours</option>
        <option value="complementary">Opposites</option>
        <option value="triad">Triangle</option>
        <option value="shades">Light to dark</option>
        <option value="pastel">Soft pastels</option>
      </select>
      <button type="button" class="ui-button ui-button--sm" id="shuffle">Surprise me</button>
      <span class="ui-spacer"></span>
      <button type="button" class="ui-button ui-button--sm" id="keep">Keep</button>
      <button type="button" class="ui-button ui-button--sm ui-button--primary" id="save">Save palette</button>
    </header>

    <main class="ui-content ui-stack ui-gap-lg">
      <div class="swatches" id="swatches" aria-label="Current palette"></div>

      <section class="ui-card ui-stack ui-gap-sm">
        <h2 class="ui-overline">How it looks together</h2>
        <div class="preview" id="preview"></div>
      </section>

      <section class="ui-stack ui-gap-sm">
        <h2 class="ui-overline">Kept palettes</h2>
        <ul class="ui-list" id="kept"></ul>
        <p class="ui-small ui-muted" id="kept-empty">Press Keep to remember a palette you like.</p>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        const el = desktop.ui.el;
        const baseInput = document.getElementById("base");
        const harmonySelect = document.getElementById("harmony");
        let base = "#3b82f6";
        let harmony = "analogous";
        let kept = [];

        function hexToHsl(hex) {
          const r = parseInt(hex.slice(1, 3), 16) / 255;
          const g = parseInt(hex.slice(3, 5), 16) / 255;
          const b = parseInt(hex.slice(5, 7), 16) / 255;
          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const l = (max + min) / 2;
          const d = max - min;
          if (!d) return { h: 0, s: 0, l: l * 100 };
          const s = d / (1 - Math.abs(2 * l - 1));
          let h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
          h = (h * 60 + 360) % 360;
          return { h: h, s: s * 100, l: l * 100 };
        }

        function hslToHex(h, s, l) {
          h = ((h % 360) + 360) % 360;
          s = Math.min(100, Math.max(0, s)) / 100;
          l = Math.min(100, Math.max(0, l)) / 100;
          const a = s * Math.min(l, 1 - l);
          const channel = (n) => {
            const k = (n + h / 30) % 12;
            const value = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
            return Math.round(value * 255).toString(16).padStart(2, "0");
          };
          return "#" + channel(0) + channel(8) + channel(4);
        }

        function readableOn(hex) {
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? "#111827" : "#ffffff";
        }

        function paletteFor(hex, kind) {
          const c = hexToHsl(hex);
          const make = (list) => list.map((item) => hslToHex(c.h + item[0], c.s + item[1], c.l + item[2]));
          switch (kind) {
            case "complementary":
              return make([[0, 0, 18], [0, 0, 0], [0, -30, 30], [180, 0, 0], [180, 0, -18]]);
            case "triad":
              return make([[0, 0, 0], [0, -20, 25], [120, 0, 0], [240, 0, 0], [240, -20, 25]]);
            case "shades":
              return [88, 70, 52, 34, 18].map((lightness) => hslToHex(c.h, c.s, lightness));
            case "pastel":
              return [0, 40, 90, 200, 300].map((turn) => hslToHex(c.h + turn, 65, 84));
            default:
              return make([[-40, 0, 0], [-20, 0, 6], [0, 0, 0], [20, 0, 6], [40, 0, 0]]);
          }
        }

        function save() {
          desktop.saveState({ base: base, harmony: harmony, kept: kept });
        }

        function render() {
          const colors = paletteFor(base, harmony);
          baseInput.value = base;
          harmonySelect.value = harmony;

          document.getElementById("swatches").replaceChildren(
            ...colors.map((color) =>
              el("div", {
                class: "swatch",
                style: "background:" + color + ";color:" + readableOn(color),
                text: color.toUpperCase(),
              })
            )
          );

          document.getElementById("preview").replaceChildren(
            el("div", {
              class: "chip",
              style: "background:" + colors[2] + ";color:" + readableOn(colors[2]),
              text: "Button",
            }),
            el("div", {
              class: "chip",
              style: "background:" + colors[0] + ";color:" + readableOn(colors[0]),
              text: "Label",
            }),
            el("div", {
              class: "chip",
              style: "box-shadow:inset 0 0 0 2px " + colors[3] + ";color:var(--foreground)",
              text: "Outline",
            }),
            el("div", { class: "mini" }, colors.map((color) => el("span", { style: "background:" + color })))
          );

          document.getElementById("kept").replaceChildren(
            ...kept.map((entry, index) =>
              el("li", { class: "ui-list__item" }, [
                el("div", { class: "mini" }, paletteFor(entry.base, entry.harmony).map((color) =>
                  el("span", { style: "background:" + color })
                )),
                el("button", {
                  type: "button",
                  class: "ui-button ui-button--sm",
                  "aria-label": "Use kept palette " + (index + 1),
                  text: "Use",
                  onclick: () => {
                    base = entry.base;
                    harmony = entry.harmony;
                    save();
                    render();
                  },
                }),
                el("button", {
                  type: "button",
                  class: "ui-button ui-button--ghost ui-button--icon ui-button--sm",
                  "aria-label": "Remove kept palette " + (index + 1),
                  text: "✕",
                  onclick: () => {
                    kept.splice(index, 1);
                    save();
                    render();
                  },
                }),
              ])
            )
          );
          document.getElementById("kept-empty").hidden = kept.length > 0;
        }

        baseInput.addEventListener("input", () => {
          base = baseInput.value;
          save();
          render();
        });

        harmonySelect.addEventListener("change", () => {
          harmony = harmonySelect.value;
          save();
          render();
        });

        document.getElementById("shuffle").addEventListener("click", () => {
          base = hslToHex(Math.random() * 360, 55 + Math.random() * 35, 42 + Math.random() * 20);
          save();
          render();
        });

        document.getElementById("keep").addEventListener("click", () => {
          if (kept.some((entry) => entry.base === base && entry.harmony === harmony)) {
            desktop.ui.toast("You already kept this one");
            return;
          }
          kept = [{ base: base, harmony: harmony }].concat(kept).slice(0, 12);
          save();
          render();
          desktop.ui.toast("Palette kept");
        });

        document.getElementById("save").addEventListener("click", () => {
          const colors = paletteFor(base, harmony);
          const lines = colors.map((color, index) => "Colour " + (index + 1) + ": " + color.toUpperCase());
          desktop.download("palette.txt", "My palette\n\n" + lines.join("\n") + "\n", "text/plain");
          desktop.ui.toast("Palette saved");
        });

        const isHex = (value) => typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value);
        const isHarmony = (value) => Array.from(harmonySelect.options).some((option) => option.value === value);

        desktop.onInit((init) => {
          const saved = init.state || {};
          if (isHex(saved.base)) base = saved.base;
          if (isHarmony(saved.harmony)) harmony = saved.harmony;
          if (Array.isArray(saved.kept)) {
            kept = saved.kept.filter((entry) => entry && isHex(entry.base) && isHarmony(entry.harmony));
          }
          render();
        });

        render();
      })();
    </script>
  </body>
</html>
